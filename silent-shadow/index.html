<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>الظل الصامت — Silent Shadow</title>
<style>
  :root { --ink:#050607; --fog:#9aa3ab; --line:rgba(220,230,240,.28); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif; color:#cfd5da; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; background:var(--ink); }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  body.playing #hud { display:block; }
  #hudInfo { position:absolute; top:max(10px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right));
    font-size:13px; letter-spacing:.04em; opacity:.62; text-shadow:0 1px 3px #000; display:flex; gap:14px; direction:rtl; }
  #hudBtns { position:absolute; top:max(8px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); display:flex; gap:8px; direction:ltr; pointer-events:auto; }
  .ib { width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:rgba(10,12,14,.45);
    color:#dfe6ea; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; touch-action:manipulation; }
  .ib:hover { background:rgba(40,48,56,.6); }
  .ib svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- Touch controls ---------- */
  #touch { position:fixed; inset:0; pointer-events:none; display:none; direction:ltr; }
  body.touch.playing #touch { display:block; }
  .pad { position:absolute; bottom:max(18px,env(safe-area-inset-bottom)); display:flex; gap:14px; align-items:flex-end; pointer-events:none; }
  .pad.l { left:max(16px,env(safe-area-inset-left)); }
  .pad.r { right:max(16px,env(safe-area-inset-right)); }
  .tb { pointer-events:auto; width:74px; height:74px; border-radius:50%; border:1.5px solid rgba(235,240,245,.32);
    background:rgba(190,205,220,.10); color:rgba(235,240,245,.85); display:flex; align-items:center; justify-content:center;
    padding:0; touch-action:none; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }
  .tb.big { width:88px; height:88px; }
  .tb.on { background:rgba(235,240,245,.28); border-color:rgba(255,255,255,.7); }
  .tb svg { width:34px; height:34px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  @media (max-height:420px) { .tb { width:62px; height:62px; } .tb.big { width:74px; height:74px; } }

  /* ---------- Screens ---------- */
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center; padding:20px; background:radial-gradient(ellipse at center, rgba(5,6,7,.45) 0%, rgba(5,6,7,.88) 100%); }
  .screen.show { display:flex; }
  .screen h1 { margin:0; font-size:clamp(38px,9vw,84px); font-weight:700; letter-spacing:.02em; color:#e6ecf0; text-shadow:0 0 28px rgba(160,185,210,.35), 0 3px 6px #000; }
  .screen h2 { margin:0 0 6px; font-size:clamp(26px,5vw,44px); font-weight:600; color:#e6ecf0; text-shadow:0 2px 8px #000; }
  .screen .sub { margin:-6px 0 18px; font-size:clamp(12px,2.4vw,18px); letter-spacing:.5em; color:#8d98a2; direction:ltr; }
  .screen p { margin:0; max-width:520px; line-height:1.9; color:#aab4bc; font-size:15px; }
  .btn { min-width:230px; padding:13px 30px; font:inherit; font-size:19px; color:#e1e8ed; background:rgba(18,22,26,.72);
    border:1px solid var(--line); border-radius:4px; cursor:pointer; touch-action:manipulation; transition:background .15s, border-color .15s, transform .1s; }
  .btn:hover, .btn:focus-visible { background:rgba(60,72,84,.65); border-color:rgba(255,255,255,.6); outline:none; }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.32; cursor:not-allowed; }
  .btn.small { min-width:0; padding:9px 20px; font-size:15px; }
  #levelGrid { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #levelGrid .btn { min-width:150px; min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  #levelGrid .btn b { font-size:30px; font-weight:600; }
  #levelGrid .btn span { font-size:13px; opacity:.7; }
  .keys { font-size:13px; opacity:.55; line-height:1.8; direction:rtl; }
  body.touch .keys.kb { display:none; }
  body:not(.touch) .keys.tc { display:none; }
  noscript { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#050607; color:#ccc; }
</style>
</head>
<body>
<noscript>يرجى تفعيل JavaScript لتشغيل اللعبة.</noscript>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hudInfo"><span id="hudLevel"></span><span id="hudDeaths"></span></div>
  <div id="hudBtns">
    <button class="ib" id="bPause" aria-label="إيقاف مؤقت"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="ib" id="bRestart" aria-label="إعادة المرحلة"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    <button class="ib" id="bSound" aria-label="الصوت"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sndWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  </div>
</div>

<div id="touch">
  <div class="pad l">
    <button class="tb" id="tLeft" aria-label="يسار"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="tb" id="tRight" aria-label="يمين"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="pad r">
    <button class="tb" id="tAct" aria-label="تفاعل / سحب"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="9" height="9" rx="1"/><path d="M15 12.5h6M18.5 9.5l3 3-3 3"/></svg></button>
    <button class="tb big" id="tJump" aria-label="قفز"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="screens">
  <section class="screen show" id="sMenu">
    <h1>الظِّلّ الصامت</h1>
    <div class="sub">SILENT SHADOW</div>
    <button class="btn" id="mContinue">متابعة</button>
    <button class="btn" id="mNew">لعبة جديدة</button>
    <button class="btn" id="mLevels">اختيار المرحلة</button>
    <div class="keys kb">الحركة: A / D أو الأسهم · القفز: W / Space · السحب والدفع: E / Shift · إعادة: R</div>
    <div class="keys tc">استخدم الأزرار الشفافة على الشاشة · يُفضَّل تدوير الجهاز أفقياً</div>
  </section>

  <section class="screen" id="sLevels">
    <h2>اختر المرحلة</h2>
    <div id="levelGrid"></div>
    <button class="btn small" id="lBack">رجوع</button>
  </section>

  <section class="screen" id="sPause">
    <h2>إيقاف مؤقت</h2>
    <button class="btn" id="pResume">استئناف</button>
    <button class="btn" id="pRestart">إعادة المرحلة</button>
    <button class="btn" id="pMenu">القائمة الرئيسية</button>
  </section>

  <section class="screen" id="sEnd">
    <h1>النهاية</h1>
    <div class="sub">THE END</div>
    <p id="endText"></p>
    <button class="btn" id="eMenu">القائمة الرئيسية</button>
  </section>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   ثوابت اللعبة
   ===================================================================== */
const T = 40;                    // حجم البلاطة
const PW = 22, PH = 44;          // أبعاد الشخصية
const EPS = 0.0001;
const GRAV_UP = 2000, GRAV_DOWN = 2650, MAXFALL = 950;
const RUN = 215, ACC_G = 2200, ACC_A = 1500, FRIC_G = 2600, FRIC_A = 500;
const JUMP_V = 640, COYOTE = 0.1, JBUF = 0.13;
const PUSH_SPEED = 105, GRAB_SPEED = 92;
const TRAP_CYCLE = 3.2;
const VIEW_H = 540, MIN_VIEW_W = 720;
const SAVE_KEY = 'silentShadow.v1';

/* =====================================================================
   بناء المراحل
   ===================================================================== */
function build(w, h, fn) {
  const g = [];
  for (let r = 0; r < h; r++) g.push(new Array(w).fill('.'));
  fn({
    rect(c0, r0, c1, r1, ch) { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) g[r][c] = ch; },
    set(c, r, ch) { g[r][c] = ch; }
  });
  return g.map(r => r.join(''));
}
/*
  # صلب     P بداية     x صندوق     a,b زر ضغط     A,B باب (يرتبط بالزر بنفس الحرف)
  ^ شوك      t فخ متوقّت  o منشار عمودي  m عدو يمشي    C نقطة حفظ     E مخرج
*/
const LEVELS = [
  {
    name: 'الممرّ الأول', sub: 'ادفع… اصعد… انجُ', theme: 0,
    rows: build(60, 14, m => {
      m.rect(0, 12, 59, 13, '#'); m.rect(0, 0, 0, 13, '#'); m.rect(59, 0, 59, 13, '#');
      m.rect(12, 12, 13, 13, '.');                         // فجوة
      m.set(2, 11, 'P');
      m.set(17, 11, 'x');
      m.rect(23, 9, 31, 11, '#');                          // منصة مرتفعة (3 بلاطات)
      m.set(25, 8, 'C'); m.set(27, 8, '^'); m.set(28, 8, '^');
      m.set(35, 11, 'x'); m.set(38, 11, 'a');
      m.rect(43, 0, 43, 8, '#'); m.rect(43, 9, 43, 11, 'A');
      m.set(47, 11, '#'); m.set(55, 11, '#'); m.set(50, 11, 'm');
      m.set(57, 11, 'E');
    }),
    hints: [
      { c: 3, r: 7, t: 'الحركة: A / D أو الأسهم\nالقفز: W أو Space أو ↑' },
      { c: 8, r: 3, t: 'اقفز فوق الفجوة' },
      { c: 19, r: 4, t: 'ادفع الصندوق نحو الجدار ثم اصعد فوقه' },
      { c: 35, r: 5, t: 'ادفع الصندوق فوق الزر ليُفتح الباب' }
    ]
  },
  {
    name: 'المصنع المهجور', sub: 'اسحب… انتظر… اقفز', theme: 1,
    rows: build(74, 14, m => {
      m.rect(0, 12, 73, 13, '#'); m.rect(0, 0, 0, 13, '#'); m.rect(73, 0, 73, 13, '#');
      m.rect(0, 0, 10, 9, '#');                            // سقف الممر الضيق
      m.rect(10, 10, 10, 11, 'A');
      m.set(3, 11, 'x'); m.set(4, 11, 'P'); m.set(7, 11, 'a');
      m.set(12, 11, 'C');
      m.rect(15, 11, 18, 11, 't'); m.rect(22, 11, 25, 11, 't');
      m.set(27, 11, 'C');
      m.set(30, 6, 'o');
      m.set(33, 11, 'x');
      m.rect(38, 9, 46, 11, '#'); m.set(42, 8, 'm');
      m.set(51, 11, 'x'); m.set(57, 11, 'b');
      m.rect(61, 0, 61, 8, '#'); m.rect(61, 9, 61, 11, 'B');
      m.set(65, 11, '#'); m.set(71, 11, '#'); m.set(68, 11, 'm');
      m.set(70, 11, 'E');
    }),
    hints: [
      { c: 5, r: 4, t: 'اضغط مع الاستمرار على E (أو زر ⇄) ثم تحرّك\nبعيداً عن الصندوق لسحبه فوق الزر' },
      { c: 14, r: 2, t: 'الفخاخ تظهر وتختفي بإيقاع ثابت — راقبها' },
      { c: 35, r: 3, t: 'استخدم الصندوق للوصول إلى المنصة' },
      { c: 55, r: 4, t: 'الباب لا يبقى مفتوحاً إلا والزر مضغوط' }
    ]
  },
  {
    name: 'البرج الأخير', sub: 'صندوقان… زرّان… ترتيب واحد', theme: 2,
    rows: build(80, 16, m => {
      m.rect(0, 14, 79, 15, '#'); m.rect(0, 0, 0, 15, '#'); m.rect(79, 0, 79, 15, '#');
      m.set(2, 13, 'P'); m.set(6, 13, 'x'); m.set(9, 13, 'x');
      m.set(17, 13, 'a'); m.set(20, 13, 'a');
      m.rect(25, 0, 25, 10, '#'); m.rect(25, 11, 25, 13, 'A');
      m.set(27, 13, 'C');
      m.rect(30, 13, 33, 13, 't'); m.rect(37, 13, 40, 13, 't');
      m.set(44, 6, 'o'); m.set(47, 7, 'o');
      m.set(49, 13, 'C');
      m.set(51, 13, 'x');
      m.rect(54, 11, 59, 13, '#'); m.set(57, 10, 'm');
      m.set(60, 5, 'o');
      m.rect(61, 9, 66, 13, '#'); m.set(63, 8, '^'); m.set(64, 8, '^');
      m.rect(68, 7, 74, 13, '#'); m.set(70, 6, 'm');
      m.set(73, 6, 'E');
    }),
    hints: [
      { c: 6, r: 6, t: 'صندوقان وزرّان… الترتيب مهمّ' },
      { c: 51, r: 3, t: 'ادفع الصندوق إلى المنصة، ثم اصعد' }
    ]
  }
];

const THEMES = [
  { top: '#161a1f', mid: '#47515b', bot: '#0e1013', fog: '150,165,180', light: '200,220,240', par: ['26,31,37', '12,15,18'] },
  { top: '#141a17', mid: '#3f4c45', bot: '#0c0f0d', fog: '140,170,150', light: '200,235,210', par: ['24,31,28', '11,14,12'] },
  { top: '#1c1613', mid: '#54453d', bot: '#0f0b0a', fog: '190,150,130', light: '255,210,170', par: ['35,26,23', '15,11,10'] }
];

/* =====================================================================
   أدوات مساعدة
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (c, r) => (((c * 73856093) ^ (r * 19349663)) >>> 0) % 1000;
const overlap = (a, b) => a.x < b.x + b.w - EPS && a.x + a.w > b.x + EPS && a.y < b.y + b.h - EPS && a.y + a.h > b.y + EPS;

/* =====================================================================
   الصوت (WebAudio مُولَّد برمجياً — بلا ملفات خارجية)
   ===================================================================== */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.7;
        this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
        this.ambient();
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  ambient() {
    const c = this.ctx;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 2;
    const g = c.createGain(); g.gain.value = 0.07;
    [48, 72.3, 96.8].forEach((f, i) => {
      const o = c.createOscillator(); o.type = i ? 'sine' : 'sawtooth'; o.frequency.value = f; o.detune.value = i * 7;
      const og = c.createGain(); og.gain.value = i ? 0.5 : 0.35; o.connect(og); og.connect(lp); o.start();
    });
    const lfo = c.createOscillator(); lfo.frequency.value = 0.08;
    const lg = c.createGain(); lg.gain.value = 90; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    lp.connect(g); g.connect(this.master);
    const wind = c.createBufferSource(); wind.buffer = this.noiseBuf; wind.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.8;
    const wg = c.createGain(); wg.gain.value = 0.02;
    const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.13;
    const lg2 = c.createGain(); lg2.gain.value = 0.012; lfo2.connect(lg2); lg2.connect(wg.gain); lfo2.start();
    wind.connect(bp); bp.connect(wg); wg.connect(this.master); wind.start();
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.7; },
  tone(f0, f1, dur, type, vol) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
  jump() { this.noise(0.12, 0.10, 900); this.tone(180, 320, 0.12, 'sine', 0.05); },
  land(v) { const k = clamp(v / 900, 0.2, 1); this.tone(90, 40, 0.18, 'sine', 0.18 * k); this.noise(0.1, 0.08 * k, 500); },
  step() { this.noise(0.05, 0.035, 380); },
  plate(on) { this.tone(on ? 520 : 360, on ? 700 : 240, 0.1, 'square', 0.04); },
  door() { this.noise(0.5, 0.07, 260); this.tone(70, 55, 0.5, 'sawtooth', 0.04); },
  lamp() { this.tone(523, 523, 0.7, 'sine', 0.06); this.tone(784, 784, 0.9, 'sine', 0.05); },
  die() { this.noise(0.5, 0.2, 1500); this.tone(220, 40, 0.7, 'sawtooth', 0.09); },
  win() { this.tone(392, 392, 0.8, 'sine', 0.06); this.tone(587, 587, 1.1, 'sine', 0.05); this.tone(784, 784, 1.5, 'sine', 0.04); }
};

/* =====================================================================
   الحفظ
   ===================================================================== */
let save = { unlocked: 0, deaths: 0, done: false };
function readSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s.unlocked === 'number') {
      save = { unlocked: clamp(s.unlocked | 0, 0, LEVELS.length - 1), deaths: Math.max(0, s.deaths | 0), done: !!s.done };
    }
  } catch (e) { /* التخزين غير متاح */ }
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }

/* =====================================================================
   حالة اللعبة العامة
   ===================================================================== */
const canvas = $('game'), ctx = canvas.getContext('2d');
let S = 1, viewW = 960, viewH = VIEW_H;              // S = dpr * scale
let mode = 'menu';                                   // menu | play | pause | end
let phase = 'playing';                               // playing | dying | finishing
let levelIdx = 0, time = 0, deadT = 0, finT = 0, shake = 0;
let fade = 1, fadeTarget = 0, card = null, hintAlpha = 0, hintText = '';
let sessionDeaths = 0;

/* عالم المرحلة */
let cols = 0, rows = 0, solid = null, doorGrid = null;
let boxes = [], doors = [], plates = [], spikes = [], traps = [], saws = [], walkers = [], lamps = [];
let exitRect = null, spawn = null, checkpoint = null, hints = [], parallax = [], particles = [];
let player = null;
const cam = { x: 0, y: 0, look: 0 };
let motes = [], noisePat = null, lastCamX = 0;

/* =====================================================================
   تحميل المرحلة
   ===================================================================== */
function loadLevel(idx) {
  levelIdx = idx;
  const def = LEVELS[idx];
  rows = def.rows.length; cols = def.rows[0].length;
  solid = new Uint8Array(cols * rows);
  doorGrid = new Int16Array(cols * rows).fill(-1);
  boxes = []; doors = []; plates = []; spikes = []; traps = []; saws = []; walkers = []; lamps = []; particles = [];
  exitRect = null; spawn = null;
  const trapOff = new Map();

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = def.rows[r][c], x = c * T, y = r * T;
      switch (ch) {
        case '#': solid[r * cols + c] = 1; break;
        case 'P': spawn = { x: x + (T - PW) / 2, y: y + T - PH }; break;
        case 'x': boxes.push({ x, y, w: T, h: T, vy: 0 }); break;
        case 'a': case 'b': plates.push({ c, r, id: ch, pressed: false, t: 0 }); break;
        case 'A': case 'B': {
          let g = null;
          if (r > 0 && def.rows[r - 1][c] === ch) g = doors[doorGrid[(r - 1) * cols + c]];
          if (!g) { g = { c, r0: r, r1: r, id: ch.toLowerCase(), open: 0, want: false }; doors.push(g); }
          g.r1 = r; doorGrid[r * cols + c] = doors.indexOf(g);

        }
        case '^': spikes.push({ x: x + 3, y: y + T * 0.5, w: T - 6, h: T * 0.5, c, r }); break;
        case 't': {
          const off = (c > 0 && def.rows[r][c - 1] === 't') ? trapOff.get((c - 1) + ',' + r) : (c * 0.71 + r * 0.3) % TRAP_CYCLE;
          trapOff.set(c + ',' + r, off);

        }
        case 'o': {

          const yTop = y + T / 2, yBot = rr * T - 16;

          break;
        }
        case 'm': walkers.push({ x: x + (T - 30) / 2, y: y + T - 26, w: 30, h: 26, dir: (c % 2) ? 1 : -1, speed: 50, anim: 0 }); break;
        case 'C': lamps.push({ c, r, x: x + T / 2, y: y + T, lit: false, px: x + (T - PW) / 2, py: y + T - PH }); break;
        case 'E': exitRect = { x: x + 4, y: y + T - 80, w: T - 8, h: 80 }; break;

    jumping: false, grab: null, gs: 1, pushing: false, anim: 0, squash: 0, stepPh: 0 };

const snapBoxes = () => boxes.map(b => ({ x: b.x, y: b.y }));

function genParallax(seed) {
  const rnd = mulberry32(seed * 7919 + 13), layers = [];
  [{ f: 0.18, al: 0.55 }, { f: 0.38, al: 0.8 }].forEach((L, li) => {
    const items = [], span = cols * T * L.f + 2000;
    let x = -300;
    while (x < span) {
      const k = rnd();
      if (k < 0.55) items.push({ t: 'pillar', x, w: 30 + rnd() * 80, h: 0.3 + rnd() * 0.6, cap: rnd() < 0.5 });
      else if (k < 0.8) items.push({ t: 'chain', x, len: 60 + rnd() * 230, ph: rnd() * 6 });
      else items.push({ t: 'pipe', x, w: 200 + rnd() * 420, y: 0.06 + rnd() * 0.3, th: 10 + rnd() * 16 });
      x += 70 + rnd() * 230;
    }
    layers.push({ f: L.f, al: L.al, items, li });
  });

}

/* =====================================================================
   الاصطدام
   ===================================================================== */
function solidAt(c, r) {
  if (c < 0 || c >= cols) return true;
  if (r < 0 || r >= rows) return false;
  if (solid[r * cols + c]) return true;
  const di = doorGrid[r * cols + c];
  return di >= 0 && doors[di].open < 0.85;
}
function solidRect(x, y, w, h) {
  const c0 = Math.floor(x / T), c1 = Math.floor((x + w - EPS) / T), r0 = Math.floor(y / T), r1 = Math.floor((y + h - EPS) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(c, r)) return true;
  return false;
}
function moveBoxX(b, dx) {
  if (!dx) return 0;
  const ox = b.x; b.x += dx;
  if (solidRect(b.x, b.y, b.w, b.h)) {
    b.x = dx > 0 ? Math.floor((b.x + b.w) / T) * T - b.w : (Math.floor(b.x / T) + 1) * T;
  }
  for (const o of boxes) if (o !== b && overlap(b, o)) b.x = dx > 0 ? o.x - b.w : o.x + o.w;
  return b.x - ox;
}
let pushedThisStep = false;
function playerMoveX(dx, ignore) {
  if (dx === 0) return 0;
  const p = player, ox = p.x;
  p.x += dx;
  for (const b of boxes) {
    if (b === ignore) continue;
    if (overlap(p, b)) {
      const pen = dx > 0 ? (p.x + p.w) - b.x : -((b.x + b.w) - p.x);
      const moved = moveBoxX(b, pen);
      if (Math.abs(moved) > 0.0001) pushedThisStep = true;
      p.x -= (pen - moved);
    }
  }
  if (solidRect(p.x, p.y, p.w, p.h)) {
    p.x = dx > 0 ? Math.floor((p.x + p.w) / T) * T - p.w : (Math.floor(p.x / T) + 1) * T;
  }
  return p.x - ox;
}
function playerMoveY(dy) {
  const p = player; let res = 0;
  p.y += dy;
  if (solidRect(p.x, p.y, p.w, p.h)) {
    if (dy > 0) { p.y = Math.floor((p.y + p.h) / T) * T - p.h; res = 1; }
    else { p.y = (Math.floor(p.y / T) + 1) * T; res = -1; }
  }
  for (const b of boxes) {
    if (overlap(p, b)) {
      if (dy > 0) { p.y = b.y - p.h; res = 1; }
      else if (dy < 0) { p.y = b.y + b.h; res = -1; }
    }
  }
  return res;
}

/* =====================================================================
   المدخلات
   ===================================================================== */
const keys = { left: false, right: false, jump: false, act: false };
const tch = { left: false, right: false, jump: false, act: false };
let jumpLatch = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  KeyE: 'act', KeyF: 'act', KeyX: 'act', ShiftLeft: 'act', ShiftRight: 'act', ArrowDown: 'act', KeyS: 'act' };

window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (e.repeat) { if (k && mode === 'play') e.preventDefault(); return; }
  Sound.unlock();
  if (mode === 'play') {
    if (k) { e.preventDefault(); keys[k] = true; if (k === 'jump') jumpLatch = true; return; }
    if (e.code === 'KeyR') { e.preventDefault(); restartLevel(); }
    else if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); pauseGame(); }
  } else if (mode === 'pause') {
    if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Enter') { e.preventDefault(); resumeGame(); }
  } else if (mode === 'menu') {
    if (e.code === 'Enter' && $('sMenu').classList.contains('show')) { e.preventDefault(); $('mContinue').click(); }
  }
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in tch) tch[k] = false; if (mode === 'play') pauseGame(); });

function bindHold(id, key) {

  const down = e => { e.preventDefault(); Sound.unlock(); tch[key] = true; if (key === 'jump') jumpLatch = true; el.classList.add('on'); };
  const up = e => { e.preventDefault(); tch[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, up));
}
bindHold('tLeft', 'left'); bindHold('tRight', 'right'); bindHold('tJump', 'jump'); bindHold('tAct', 'act');
window.addEventListener('touchstart', () => document.body.classList.add('touch'), { passive: true });
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

/* =====================================================================
   تحديث اللاعب
   ===================================================================== */
function tryGrab() {
  const p = player; let best = null, bd = 99;
  for (const b of boxes) {
    if (!(b.y < p.y + p.h - 6 && b.y + b.h > p.y + 6)) continue;
    if (Math.abs((b.y + b.h) - (p.y + p.h)) > 10) continue;
    const gap = p.face > 0 ? b.x - (p.x + p.w) : p.x - (b.x + b.w);
    if (gap >= -3 && gap <= 14 && gap < bd) { bd = gap; best = b; }
  }
  if (best) { player.grab = best; player.gs = p.face; }
}

function updatePlayer(h) {
  const p = player;
  const inp = { left: keys.left || tch.left, right: keys.right || tch.right, jump: keys.jump || tch.jump, act: keys.act || tch.act };
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (jumpLatch) { p.buf = JBUF; jumpLatch = false; }
  p.buf = Math.max(0, p.buf - h);
  p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - h);

  /* سحب / دفع الصندوق */
  if (inp.act && p.onGround && !p.grab) tryGrab();
  if (p.grab) {
    const b = p.grab;
    const gap = p.gs > 0 ? b.x - (p.x + p.w) : p.x - (b.x + b.w);
    const aligned = b.y < p.y + p.h - 6 && b.y + b.h > p.y + 6 && Math.abs((b.y + b.h) - (p.y + p.h)) <= 10;
    if (!inp.act || !p.onGround || gap < -3 || gap > 16 || !aligned) p.grab = null;
  }

  /* السرعة الأفقية */
  let cap = RUN;
  if (p.grab) { cap = GRAB_SPEED; p.face = p.gs; }
  else if (p.pushing) cap = PUSH_SPEED;
  if (dir && !p.grab) p.face = dir;
  const rate = dir ? (p.onGround ? ACC_G : ACC_A) : (p.onGround ? FRIC_G : FRIC_A);
  p.vx = approach(p.vx, dir * cap, rate * h);

  /* القفز */
  if (p.buf > 0 && p.coyote > 0 && !p.grab) {
    p.vy = -JUMP_V; p.buf = 0; p.coyote = 0; p.onGround = false; p.jumping = true;
    Sound.jump(); dust(p.x + p.w / 2, p.y + p.h, 4);
  }
  if (p.jumping && !inp.jump && p.vy < -220) { p.vy = -220; p.jumping = false; }
  if (p.vy >= 0) p.jumping = false;

  /* الحركة الأفقية */
  pushedThisStep = false;
  const dx = p.vx * h;
  if (dx !== 0) {
    if (p.grab) {
      const b = p.grab;
      if (Math.sign(dx) === p.gs) {                    // دفع الصندوق الممسوك
        const moved = moveBoxX(b, dx);
        playerMoveX(moved, b);
        pushedThisStep = true;
        if (Math.abs(moved) < Math.abs(dx) * 0.6) p.vx = 0;
      } else {                                         // سحب الصندوق
        const a = playerMoveX(dx, b);
        if (a !== 0) moveBoxX(b, a);
        if (Math.abs(a) < Math.abs(dx) * 0.6) p.vx = 0;
      }
    } else {
      const a = playerMoveX(dx, null);
      if (Math.abs(a) < Math.abs(dx) * 0.6) p.vx = 0;
    }
  }
  p.pushing = pushedThisStep && !p.grab;

  /* الحركة الرأسية */
  p.vy = Math.min(p.vy + (p.vy < 0 ? GRAV_UP : GRAV_DOWN) * h, MAXFALL);
  const wasAir = !p.onGround, fallV = p.vy;
  const res = playerMoveY(p.vy * h);

  } else {
    if (res === -1) p.vy = 0;
    p.onGround = false;
  }

  /* حركة الجسم */
  p.squash = Math.max(0, p.squash - h * 5);
  if (p.onGround && Math.abs(p.vx) > 10) {
    p.anim += Math.abs(p.vx) * h * (p.grab || p.pushing ? 0.09 : 0.062);
    const ph = Math.floor(p.anim / Math.PI);
    if (ph !== p.stepPh) { p.stepPh = ph; Sound.step(); }
  }
  if (!p.onGround) p.anim += h * 4;

  /* خروج الصندوق من فوق اللاعب بلطف */
  for (const b of boxes) {
    if (b.vy <= 120 && overlap(p, b)) {
      const l = p.x + p.w - b.x, r = b.x + b.w - p.x;
      p.x = l < r ? b.x - p.w : b.x + b.w;
    }
  }
}

/* =====================================================================
   الصناديق، الأزرار، الأبواب، المخاطر
   ===================================================================== */
function updateBox(b, h) {
  b.vy = Math.min(b.vy + GRAV_DOWN * 0.8 * h, 900);
  const dy = b.vy * h; b.y += dy;
  if (solidRect(b.x, b.y, b.w, b.h)) {
    b.y = dy > 0 ? Math.floor((b.y + b.h) / T) * T - b.h : (Math.floor(b.y / T) + 1) * T;
    b.vy = 0;
  }
  for (const o of boxes) {
    if (o !== b && overlap(b, o)) { b.y = dy > 0 ? o.y - b.h : o.y + o.h; b.vy = 0; }
  }
  if (b.y > rows * T + 200) {
    const i = boxes.indexOf(b), s = checkpoint.boxes[i];
    b.x = s.x; b.y = s.y; b.vy = 0;
  }
}

function updatePlatesAndDoors(h) {
  for (const pl of plates) {
    const zone = { x: pl.c * T + 6, y: pl.r * T + T - 10, w: T - 12, h: 10 };
    let on = false;
    if (phase === 'playing' && overlap(player, zone)) on = true;
    for (const b of boxes) if (overlap(b, zone)) on = true;
    if (on !== pl.pressed) { pl.pressed = on; Sound.plate(on); }
    pl.t = approach(pl.t, on ? 1 : 0, h * 10);
  }
  for (const g of doors) {
    const mine = plates.filter(p => p.id === g.id);
    let want = mine.length > 0 && mine.every(p => p.pressed);
    if (!want && g.open > 0) {                         // لا يُغلق الباب على شيء بداخله
      const r = { x: g.c * T, y: g.r0 * T, w: T, h: (g.r1 - g.r0 + 1) * T };
      if (overlap(player, r) || boxes.some(b => overlap(b, r)) || walkers.some(w => overlap(w, r))) want = true;
    }
    if (want !== g.want) { g.want = want; Sound.door(); }
    g.open = clamp(g.open + (want ? 1 : -1) * h * 1.6, 0, 1);
  }
}

function updateHazardVis() {
  for (const t of traps) {
    const p = (time + t.off) % TRAP_CYCLE;
    t.ph = p;
    if (p < 1.4) t.ext = 0;
    else if (p < 1.8) t.ext = 0.2 * ((p - 1.4) / 0.4);
    else if (p < 2.0) t.ext = 0.2 + 0.8 * ((p - 1.8) / 0.2);
    else if (p < 2.6) t.ext = 1;
    else t.ext = 1 - (p - 2.6) / 0.6;
  }
  for (const s of saws) {
    const q = ((time + s.off) * s.speed) % (2 * s.len);
    s.y = s.yTop + (q < s.len ? q : 2 * s.len - q);
    s.rot = time * 6 + s.x;
  }
}

function updateWalkers(h) {
  for (const w of walkers) {
    w.anim += h * 8;
    const nx = w.x + w.dir * w.speed * h;
    let turn = false;
    if (solidRect(nx, w.y, w.w, w.h)) turn = true;
    else {
      const fx = w.dir > 0 ? nx + w.w + 1 : nx - 1;
      if (!solidAt(Math.floor(fx / T), Math.floor((w.y + w.h + 2) / T))) turn = true;
      else for (const b of boxes) if (nx < b.x + b.w && nx + w.w > b.x && w.y < b.y + b.h && w.y + w.h > b.y) turn = true;
    }
    if (turn) w.dir *= -1; else w.x = nx;
  }

function checkRules() {
  const p = player;
  const hb = { x: p.x + 4, y: p.y + 5, w: p.w - 8, h: p.h - 7 };
  for (const s of spikes) if (overlap(hb, s)) return kill();
  for (const t of traps) {
    if (t.ext > 0.55) {
      const hh = t.ext * T * 0.7;
      if (overlap(hb, { x: t.c * T + 4, y: (t.r + 1) * T - hh, w: T - 8, h: hh })) return kill();
    }
  }
  for (const s of saws) {
    const cx = clamp(s.x, hb.x, hb.x + hb.w), cy = clamp(s.y, hb.y, hb.y + hb.h);
    if ((cx - s.x) ** 2 + (cy - s.y) ** 2 < (s.r - 2) ** 2) return kill();
  }
  for (const w of walkers) if (overlap(hb, { x: w.x + 3, y: w.y + 3, w: w.w - 6, h: w.h - 3 })) return kill();
  for (const b of boxes) if (b.vy > 120 && overlap(hb, b)) return kill();
  if (p.y > rows * T + 80) return kill();
  for (const l of lamps) {
    if (!l.lit && overlap(p, { x: l.c * T - 6, y: l.r * T - 20, w: T + 12, h: T + 20 })) {
      l.lit = true; checkpoint = { x: l.px, y: l.py, boxes: snapBoxes() }; Sound.lamp();
    }
  }
  if (exitRect && overlap(p, exitRect)) finishLevel();
}

function kill() {

  phase = 'dying'; deadT = 0; shake = 12;
  save.deaths++; sessionDeaths++; writeSave(); updateHud();
  const p = player;
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 260;
    particles.push({ x: p.x + p.w / 2, y: p.y + p.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 1.1, max: 1.1, g: 900, shard: true, r: 1.5 + Math.random() * 3 });
  }

}
function respawn() {
  const p = player;
  p.x = checkpoint.x; p.y = checkpoint.y; p.vx = p.vy = 0; p.grab = null; p.onGround = false; p.pushing = false;
  boxes.forEach((b, i) => { const s = checkpoint.boxes[i]; b.x = s.x; b.y = s.y; b.vy = 0; });
  phase = 'playing'; fadeTarget = 0; snapCamera();
}
function finishLevel() {
  if (phase !== 'playing') return;
  phase = 'finishing'; finT = 0; player.grab = null; Sound.win();
}
function nextLevel() {
  if (levelIdx + 1 < LEVELS.length) {
    save.unlocked = Math.max(save.unlocked, levelIdx + 1); writeSave();
    loadLevel(levelIdx + 1);
  } else {
    save.done = true; writeSave();
    mode = 'end'; document.body.classList.remove('playing');
    $('endText').textContent = 'خرجتَ من الظلام… لكنّ الظلّ سيبقى معك دائماً.  عدد المحاولات الفاشلة: ' + save.deaths;
    showScreen('sEnd');
  }
}
function restartLevel() { loadLevel(levelIdx); fade = 0.8; fadeTarget = 0; card = null; }

/* =====================================================================
   الجسيمات والكاميرا
   ===================================================================== */
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: x + (Math.random() - .5) * 10, y: y - 2, vx: (Math.random() - .5) * 70, vy: -Math.random() * 40, life: .5, max: .5, g: -10, shard: false, r: 2 + Math.random() * 2 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt; if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.shard && solidRect(q.x - 1, q.y, 2, 2)) { q.vy *= -0.3; q.vx *= 0.6; q.y -= 2; }
  }
}
function camTarget() {
  const p = player;
  let tx = p.x + p.w / 2 + cam.look - viewW / 2;
  let ty = p.y + p.h / 2 - viewH * 0.58;
  const maxX = cols * T - viewW, maxY = rows * T - viewH;
  tx = maxX < 0 ? maxX / 2 : clamp(tx, 0, maxX);
  ty = maxY < 0 ? maxY / 2 : clamp(ty, 0, maxY);

}
function snapCamera() { cam.look = player.face * 70; const t = camTarget(); cam.x = t.x; cam.y = t.y; lastCamX = cam.x; }
function updateCamera(dt) {
  cam.look += (player.face * 70 - cam.look) * (1 - Math.exp(-2.5 * dt));
  const t = camTarget();
  cam.x += (t.x - cam.x) * (1 - Math.exp(-5.5 * dt));
  cam.y += (t.y - cam.y) * (1 - Math.exp(-4 * dt));
}

/* =====================================================================
   حلقة التحديث
   ===================================================================== */
function step(h) {
  time += h;
  updateHazardVis();
  updatePlatesAndDoors(h);
  for (const b of boxes) updateBox(b, h);
  if (phase === 'playing') updatePlayer(h);
  updateWalkers(h);
  if (phase === 'playing') checkRules();
}
function update(dt) {
  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n;
  for (let i = 0; i < n; i++) step(h);

  if (phase === 'dying') {
    deadT += dt;
    if (deadT > 0.75) fadeTarget = 1;
    if (deadT > 1.3) respawn();
  } else if (phase === 'finishing') {
    finT += dt;
    if (finT > 0.5) fadeTarget = 1;
    if (finT > 1.6) nextLevel();
  }
  fade = approach(fade, fadeTarget, dt * 1.8);
  shake = Math.max(0, shake - dt * 30);
  updateParticles(dt);
  if (phase === 'playing' || phase === 'finishing') updateCamera(dt);

  /* التلميحات */
  let ht = '';
  if (phase === 'playing') {
    const pc = (player.x + PW / 2) / T;
    for (const hint of hints) if (Math.abs(pc - hint.c) <= hint.r) { ht = hint.t; break; }
  }
  if (ht) hintText = ht;
  hintAlpha = approach(hintAlpha, ht ? 1 : 0, dt * 2.5);
  if (card) { card.t += dt; if (card.t > 4) card = null; }
}
function ambient(dt) {
  time += dt;
  updateHazardVis();
  fade = approach(fade, fadeTarget, dt * 1.8);
  const maxX = Math.max(0, cols * T - viewW);
  const k = (Math.sin(time * 0.07) * 0.5 + 0.5);
  cam.x = maxX * k; cam.y = clamp(rows * T - viewH, 0, 1e9);
  updateParticles(dt);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  let sc = ch / VIEW_H;
  viewW = cw / sc; viewH = VIEW_H;
  if (viewW < MIN_VIEW_W) { sc = cw / MIN_VIEW_W; viewW = MIN_VIEW_W; viewH = ch / sc; }
  S = dpr * sc;
  motes = [];
  for (let i = 0; i < 55; i++) motes.push({ x: Math.random() * viewW, y: Math.random() * viewH, r: .6 + Math.random() * 1.6, vx: 4 + Math.random() * 10, vy: -2 + Math.random() * 4, a: .15 + Math.random() * .35, p: Math.random() * 6 });
  if (player) snapCamera();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function makeNoise() {
  const n = document.createElement('canvas'); n.width = n.height = 128;
  const c = n.getContext('2d'), id = c.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  c.putImageData(id, 0, 0);
  noisePat = ctx.createPattern(n, 'repeat');
}

function drawBackdrop(th, camX, camY) {
  const w = viewW, h = viewH;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, th.top); g.addColorStop(0.58, th.mid); g.addColorStop(1, th.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = 'lighter';
  const hz = ctx.createRadialGradient(w * 0.7 - camX * 0.03, h * 0.38, 10, w * 0.7 - camX * 0.03, h * 0.38, h * 0.9);
  hz.addColorStop(0, 'rgba(' + th.light + ',0.14)'); hz.addColorStop(1, 'rgba(' + th.light + ',0)');
  ctx.fillStyle = hz; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 3; i++) {                        // أشعة ضوء
    const x0 = ((i * 330 + 120) - camX * 0.25) % (w + 400) - 100;
    const sw = Math.sin(time * 0.2 + i) * 18;
    const lg = ctx.createLinearGradient(0, 0, 0, h * 0.9);
    lg.addColorStop(0, 'rgba(' + th.light + ',0.07)'); lg.addColorStop(1, 'rgba(' + th.light + ',0)');
    ctx.fillStyle = lg; ctx.beginPath();
    ctx.moveTo(x0 + sw, 0); ctx.lineTo(x0 + 70 + sw, 0); ctx.lineTo(x0 + 210 + sw * 2, h * 0.9); ctx.lineTo(x0 + 90 + sw * 2, h * 0.9); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* طبقات المنظور */
  for (const L of parallax) {
    ctx.fillStyle = 'rgba(' + th.par[L.li] + ',' + L.al + ')';
    ctx.strokeStyle = ctx.fillStyle;
    const baseY = h * (L.li ? 0.97 : 0.9) - camY * L.f * 0.25;
    for (const it of L.items) {
      const sx = it.x - camX * L.f;
      if (sx < -600 || sx > w + 100) continue;
      if (it.t === 'pillar') {
        const ph = it.h * h * (L.li ? 1.1 : 1);
        ctx.fillRect(sx, baseY - ph, it.w, ph + h);
        if (it.cap) ctx.fillRect(sx - 6, baseY - ph - 8, it.w + 12, 12);
        else { ctx.beginPath(); ctx.moveTo(sx, baseY - ph); ctx.lineTo(sx + it.w * 0.4, baseY - ph - 14); ctx.lineTo(sx + it.w, baseY - ph + 6); ctx.fill(); }
      } else if (it.t === 'chain') {
        const sw = Math.sin(time * 0.6 + it.ph) * 5 * (1 + L.li);
        ctx.lineWidth = 2 + L.li; ctx.beginPath(); ctx.moveTo(sx, -10); ctx.quadraticCurveTo(sx + sw * 0.4, it.len * 0.5, sx + sw, it.len); ctx.stroke();
        ctx.beginPath(); ctx.arc(sx + sw, it.len + 7, 7 + L.li * 2, 0, 7); ctx.fill();
      } else {
        const py = it.y * h;
        ctx.fillRect(sx, py, it.w, it.th);
        ctx.fillRect(sx + it.w * 0.2, py - 4, 8, it.th + 8); ctx.fillRect(sx + it.w * 0.75, py - 4, 8, it.th + 8);
      }
    }
    if (!L.li) {                                       // ضباب بين الطبقتين
      const fg = ctx.createLinearGradient(0, h * 0.45, 0, h);
      fg.addColorStop(0, 'rgba(' + th.fog + ',0)'); fg.addColorStop(1, 'rgba(' + th.fog + ',0.26)');
      ctx.fillStyle = fg; ctx.fillRect(0, h * 0.45, w, h * 0.55);
    }
  }
  for (let i = 0; i < 4; i++) {                        // سُحب ضباب متحركة
    const x = ((i * 380 + time * (9 + i * 3)) % (w + 700)) - 350 - (camX * 0.12) % 50;
    const y = h * (0.55 + i * 0.1);
    ctx.save(); ctx.translate(x, y); ctx.scale(2.4, 0.45);
    const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, 170);
    fg.addColorStop(0, 'rgba(' + th.fog + ',0.11)'); fg.addColorStop(1, 'rgba(' + th.fog + ',0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, 0, 170, 0, 7); ctx.fill(); ctx.restore();
  }
}

function tileSolid(c, r) { if (c < 0 || c >= cols) return true; if (r < 0 || r >= rows) return false; return solid[r * cols + c] === 1; }

function drawWorld(th, camX, camY, glows) {
  const c0 = Math.max(0, Math.floor(camX / T) - 1), c1 = Math.min(cols - 1, Math.floor((camX + viewW) / T) + 1);
  const r0 = Math.max(0, Math.floor(camY / T) - 1), r1 = Math.min(rows - 1, Math.floor((camY + viewH) / T) + 1);

  /* الأبواب (خلف البلاطات لتنزلق داخل السقف) */
  for (const g of doors) {
    if (g.c < c0 - 1 || g.c > c1 + 1) continue;
    const top = g.r0 * T, hgt = (g.r1 - g.r0 + 1) * T, off = g.open * hgt;
    const y = top - off;
    ctx.fillStyle = '#14181c'; ctx.fillRect(g.c * T + 2, y, T - 4, hgt);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    for (let yy = y + 10; yy < y + hgt; yy += 20) ctx.fillRect(g.c * T + 2, yy, T - 4, 3);
    ctx.fillStyle = 'rgba(150,165,180,.28)'; ctx.fillRect(g.c * T + 2, y, 2, hgt); ctx.fillRect(g.c * T + T - 4, y, 2, hgt);
    ctx.fillStyle = g.want ? '#7fe3c0' : '#d0453a';
    ctx.fillRect(g.c * T + T / 2 - 3, y + hgt - 9, 6, 4);
    if (g.open < 0.98) glows.push({ x: g.c * T + T / 2, y: y + hgt - 7, r: 26, col: g.want ? '127,227,192' : '208,69,58', a: 0.35 });
  }

  /* البلاطات */
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (!solid[r * cols + c]) continue;
      const hs = hash(c, r), sh = 9 + (hs % 5), x = c * T, y = r * T;
      ctx.fillStyle = 'rgb(' + sh + ',' + (sh + 1) + ',' + (sh + 3) + ')';
      ctx.fillRect(x, y, T + 0.6, T + 0.6);
      if (hs % 9 === 0) { ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x + (hs % 30) + 4, y + 2); ctx.lineTo(x + (hs % 20) + 12, y + 20); ctx.lineTo(x + (hs % 14) + 8, y + 36); ctx.stroke(); }
      if (!tileSolid(c, r - 1)) {
        ctx.fillStyle = 'rgba(130,145,160,.32)'; ctx.fillRect(x, y, T, 2);
        ctx.fillStyle = '#050607';
        for (let k = 0; k < 3; k++) {
          const bx = x + ((hs * (k + 3)) % 34) + 2, bh = 3 + ((hs + k * 37) % 7);
          ctx.beginPath(); ctx.moveTo(bx - 2.5, y + 0.5); ctx.lineTo(bx, y - bh); ctx.lineTo(bx + 2.5, y + 0.5); ctx.fill();
        }
      }
      if (!tileSolid(c, r + 1) && r + 1 < rows) {
        ctx.fillStyle = '#050607';
        for (let k = 0; k < 2; k++) { const bx = x + ((hs * (k + 5)) % 32) + 3; ctx.fillRect(bx, y + T - 1, 2.5, 4 + ((hs + k * 13) % 9)); }
        ctx.fillStyle = 'rgba(130,145,160,.16)'; ctx.fillRect(x, y + T - 1.5, T, 1.5);
      }
      if (!tileSolid(c - 1, r) && c > 0) { ctx.fillStyle = 'rgba(130,145,160,.14)'; ctx.fillRect(x, y, 1.5, T); }
      if (!tileSolid(c + 1, r) && c < cols - 1) { ctx.fillStyle = 'rgba(130,145,160,.14)'; ctx.fillRect(x + T - 1.5, y, 1.5, T); }
    }
  }

  /* أزرار الضغط */
  for (const pl of plates) {
    const x = pl.c * T, y = pl.r * T + T, dep = pl.t * 4;
    ctx.fillStyle = '#0a0c0e'; ctx.fillRect(x + 4, y - 4, T - 8, 4);
    ctx.fillStyle = '#1c2227'; ctx.fillRect(x + 7, y - 9 + dep, T - 14, 5);
    ctx.fillStyle = 'rgba(160,175,190,.35)'; ctx.fillRect(x + 7, y - 9 + dep, T - 14, 1.2);
    const col = pl.pressed ? '127,227,192' : '208,69,58';
    ctx.fillStyle = 'rgb(' + col + ')'; ctx.fillRect(x + T / 2 - 2.5, y - 7 + dep, 5, 2);
    glows.push({ x: x + T / 2, y: y - 6, r: 24, col, a: pl.pressed ? 0.4 : 0.22 });
  }

  /* المصابيح (نقاط الحفظ) */
  for (const l of lamps) {
    const x = l.x, y = l.y;
    ctx.fillStyle = '#050607'; ctx.fillRect(x - 2, y - 38, 4, 38);
    ctx.fillRect(x - 6, y - 3, 12, 3);
    ctx.fillRect(x - 8, y - 46, 16, 3); ctx.fillRect(x - 8, y - 33, 16, 3);
    const fl = 0.85 + Math.sin(time * 9 + l.c) * 0.08 + Math.sin(time * 23 + l.c * 3) * 0.05;
    ctx.fillStyle = l.lit ? 'rgba(255,214,150,' + fl + ')' : 'rgba(110,125,140,.6)';
    ctx.fillRect(x - 5, y - 43, 10, 10);
    glows.push({ x, y: y - 38, r: l.lit ? 130 : 40, col: l.lit ? '255,205,140' : '120,140,160', a: l.lit ? 0.42 * fl : 0.15 });
  }

  /* المخرج */
  if (exitRect) {
    const e = exitRect, pulse = 0.8 + Math.sin(time * 2) * 0.15;
    const gr = ctx.createLinearGradient(0, e.y, 0, e.y + e.h);
    gr.addColorStop(0, 'rgba(230,240,255,0)'); gr.addColorStop(1, 'rgba(235,242,255,' + (0.7 * pulse) + ')');
    ctx.fillStyle = gr; ctx.fillRect(e.x, e.y, e.w, e.h);
    glows.push({ x: e.x + e.w / 2, y: e.y + e.h - 24, r: 150, col: '220,235,255', a: 0.5 * pulse });
  }

  /* الأشواك */
  ctx.fillStyle = '#050607';
  for (const s of spikes) {
    if (s.c < c0 - 1 || s.c > c1 + 1) continue;
    const base = (s.r + 1) * T, bx = s.c * T;
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(bx + k * 10, base); ctx.lineTo(bx + k * 10 + 5, base - 20); ctx.lineTo(bx + k * 10 + 10, base); ctx.fill(); }
    ctx.fillRect(bx, base - 2, T, 2);
    ctx.fillStyle = 'rgba(170,185,200,.35)';
    for (let k = 0; k < 4; k++) ctx.fillRect(bx + k * 10 + 4.5, base - 20, 1, 4);
    ctx.fillStyle = '#050607';
  }
  /* الفخاخ المتوقّتة */
  for (const t of traps) {
    const base = (t.r + 1) * T, bx = t.c * T, hh = t.ext * T * 0.8;
    ctx.fillStyle = '#0a0c0e'; ctx.fillRect(bx, base - 3, T, 3);
    const warn = t.ph > 1.4 && t.ph < 1.8;
    const jit = warn ? Math.sin(time * 70) * 1.1 : 0;
    if (hh > 0.5) {
      ctx.fillStyle = '#050607';
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(bx + k * 10 + jit, base - 3); ctx.lineTo(bx + k * 10 + 5 + jit, base - 3 - hh); ctx.lineTo(bx + k * 10 + 10 + jit, base - 3); ctx.fill(); }
      if (t.ext > 0.55) { ctx.fillStyle = 'rgba(190,60,50,.55)'; for (let k = 0; k < 4; k++) ctx.fillRect(bx + k * 10 + 4.5, base - 3 - hh, 1.2, 3); }
    }
    ctx.fillStyle = warn ? 'rgba(210,70,55,.9)' : 'rgba(110,120,130,.35)';
    ctx.fillRect(bx + 3, base - 2, T - 6, 1.5);
  }

  /* المناشير */
  for (const s of saws) {
    if (s.x < camX - 60 || s.x > camX + viewW + 60) continue;
    ctx.strokeStyle = '#08090a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x, camY - 10); ctx.lineTo(s.x, s.y - s.r); ctx.stroke();
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = '#08090a'; ctx.beginPath();
    for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2, rr = k % 2 ? 11.5 : s.r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(170,185,200,.4)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(170,185,200,.35)'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill();
    ctx.restore();
  }

  /* الصناديق */
  for (const b of boxes) {
    ctx.fillStyle = '#231d18'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3; ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.moveTo(b.x + 3, b.y + 13); ctx.lineTo(b.x + b.w - 3, b.y + 13); ctx.moveTo(b.x + 3, b.y + 27); ctx.lineTo(b.x + b.w - 3, b.y + 27);
    ctx.moveTo(b.x + 5, b.y + 5); ctx.lineTo(b.x + b.w - 5, b.y + b.h - 5); ctx.stroke();
    ctx.lineWidth = 1.2; ctx.strokeStyle = (player && player.grab === b) ? 'rgba(235,245,255,.7)' : 'rgba(165,150,130,.34)';
    ctx.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
  }

  /* الأعداء */
  for (const w of walkers) {
    const cx = w.x + w.w / 2, by = w.y + w.h, bob = Math.sin(w.anim) * 1.2;
    ctx.save(); ctx.translate(cx, by); ctx.scale(w.dir, 1);
    ctx.fillStyle = '#030304'; ctx.strokeStyle = '#030304'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 4; k++) { const ph = w.anim + k * 1.6, fx = -10 + k * 6.6; ctx.beginPath(); ctx.moveTo(fx, -8); ctx.lineTo(fx + Math.sin(ph) * 3.5, -Math.max(0, Math.cos(ph)) * 3); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(0, -14 + bob, 15, 11, 0, 0, 7); ctx.fill();
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-9 + k * 6, -23 + bob); ctx.lineTo(-6 + k * 6, -30 + bob - (k % 2) * 3); ctx.lineTo(-3 + k * 6, -23 + bob); ctx.fill(); }
    ctx.fillStyle = '#ff5a4a'; ctx.beginPath(); ctx.arc(7, -17 + bob, 2.4, 0, 7); ctx.arc(2.5, -17 + bob, 2.4, 0, 7); ctx.fill();
    ctx.restore();
    glows.push({ x: cx + w.dir * 5, y: by - 17, r: 34, col: '255,80,64', a: 0.35 });
  }

  /* اللاعب */
  drawPlayer();

  /* الجسيمات */
  for (const q of particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.shard ? 'rgba(3,3,4,' + a + ')' : 'rgba(180,195,210,' + (a * 0.35) + ')';
    if (q.shard) ctx.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2);
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  }
}

function drawPlayer() {
  const p = player;
  if (!p || phase === 'dying') return;
  const cx = p.x + p.w / 2, by = p.y + p.h;
  const walking = p.onGround && Math.abs(p.vx) > 15, t = p.anim;
  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(p.face * (1 + p.squash * 0.14), 1 - p.squash * 0.18);
  ctx.shadowColor = 'rgba(175,195,215,0.38)'; ctx.shadowBlur = 9;
  ctx.fillStyle = '#030304'; ctx.strokeStyle = '#030304'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  /* الساقان */
  ctx.lineWidth = 5.5;
  for (let s = 0; s < 2; s++) {
    let fx, lift;
    if (!p.onGround) { fx = s ? -5 : 6; lift = s ? 8 : 3; }
    else if (walking) { const ph = t + s * Math.PI; fx = Math.sin(ph) * (p.grab ? 5 : 8); lift = Math.max(0, Math.cos(ph)) * 5; }
    else { fx = s ? -2.5 : 2.5; lift = 0; }
    ctx.beginPath(); ctx.moveTo(0, -15); ctx.quadraticCurveTo(fx * 0.5 + 1, -8, fx, -2 - lift); ctx.stroke();
  }
  /* الجذع */
  const lean = walking && !p.grab ? 2.5 : 1.2;
  ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(lean, -31); ctx.stroke();
  /* الذراعان */
  ctx.lineWidth = 4.2;
  const sx = lean, sy = -29;
  if (p.grab) {
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 15, sy + 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy + 2); ctx.lineTo(sx + 14, sy + 10); ctx.stroke();
  } else if (p.pushing) {
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 13, sy + 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy + 2); ctx.lineTo(sx + 12, sy + 9); ctx.stroke();
  } else if (!p.onGround) {
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 9, sy - 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - 8, sy - 5); ctx.stroke();
  } else {
    const sw = walking ? Math.sin(t) * 8 : 0;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sw + 1, sy + 13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - sw - 1, sy + 13); ctx.stroke();
  }
  /* الرأس */
  ctx.beginPath(); ctx.arc(lean + 1.2, -38, 6.2, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(232,240,248,.85)'; ctx.beginPath(); ctx.arc(lean + 4, -39, 1.1, 0, 7); ctx.fill();
  ctx.restore();
}

function drawText(txt, x, y, size, alpha, weight) {
  ctx.globalAlpha = alpha;
  ctx.font = (weight || 600) + ' ' + size + 'px "Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = txt.split('\n');
  lines.forEach((ln, i) => {
    const yy = y + (i - (lines.length - 1) / 2) * size * 1.5;
    ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillText(ln, x + 1.5, yy + 1.5);
    ctx.fillStyle = '#e4eaee'; ctx.fillText(ln, x, yy);
  });
  ctx.globalAlpha = 1;
}

function drawOverlay(th, camX, camY, glows) {
  const w = viewW, h = viewH;
  /* الظلام حول اللاعب */
  const pxs = player ? player.x + PW / 2 - camX : w / 2, pys = player ? player.y + PH / 2 - camY : h / 2;
  const dk = ctx.createRadialGradient(pxs, pys, 110, pxs, pys, Math.max(w, h) * 0.78);
  dk.addColorStop(0, 'rgba(0,0,0,0)'); dk.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = dk; ctx.fillRect(0, 0, w, h);
  const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);

  /* وهج المصادر الضوئية */
  ctx.globalCompositeOperation = 'lighter';
  for (const g of glows) {
    const sx = g.x - camX, sy = g.y - camY;
    if (sx < -g.r || sx > w + g.r || sy < -g.r || sy > h + g.r) continue;
    const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, g.r);
    gr.addColorStop(0, 'rgba(' + g.col + ',' + g.a + ')'); gr.addColorStop(1, 'rgba(' + g.col + ',0)');
    ctx.fillStyle = gr; ctx.fillRect(sx - g.r, sy - g.r, g.r * 2, g.r * 2);
  }
  /* غبار عائم */
  const dcx = camX - lastCamX; lastCamX = camX;
  for (const m of motes) {
    m.x += m.vx * 0.016 - dcx * 0.6; m.y += m.vy * 0.016 + Math.sin(time + m.p) * 0.05;
    if (m.x > w + 5) m.x = -5; if (m.x < -5) m.x = w + 5; if (m.y < -5) m.y = h + 5; if (m.y > h + 5) m.y = -5;
    ctx.fillStyle = 'rgba(' + th.light + ',' + (m.a * (0.6 + Math.sin(time * 1.5 + m.p) * 0.4)) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* حبيبات الفيلم */
  if (noisePat) {
    ctx.save(); ctx.globalAlpha = 0.055; ctx.translate(Math.random() * 128, Math.random() * 128);
    ctx.fillStyle = noisePat; ctx.fillRect(-128, -128, w + 256, h + 256); ctx.restore();
  }

  /* التلميحات وبطاقة العنوان */
  if (mode === 'play' || mode === 'pause') {
    if (hintAlpha > 0.01 && hintText) drawText(hintText, w / 2, Math.max(78, h * 0.17), clamp(w / 38, 14, 20), hintAlpha * 0.92, 500);
    if (card) {
      const a = Math.min(1, card.t / 0.7, (4 - card.t) / 0.9);
      if (a > 0) {
        drawText(card.title, w / 2, h * 0.36, clamp(w / 20, 24, 44), a, 700);
        drawText(card.sub, w / 2, h * 0.36 + clamp(w / 14, 40, 64), clamp(w / 44, 14, 22), a * 0.75, 400);
      }
    }
  }
  /* الأسود والوميض الأحمر */
  if (phase === 'dying' && deadT < 0.35) { ctx.fillStyle = 'rgba(120,10,10,' + (0.28 * (1 - deadT / 0.35)) + ')'; ctx.fillRect(0, 0, w, h); }
  if (fade > 0.002) { ctx.fillStyle = 'rgba(0,0,0,' + clamp(fade, 0, 1) + ')'; ctx.fillRect(0, 0, w, h); }
}

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  const th = THEMES[LEVELS[levelIdx].theme];
  let sx = 0, sy = 0;
  if (shake > 0.1) { sx = (Math.random() - .5) * shake; sy = (Math.random() - .5) * shake; }
  const camX = Math.round((cam.x + sx) * S) / S, camY = Math.round((cam.y + sy) * S) / S;
  const glows = [];
  drawBackdrop(th, camX, camY);
  /* توهّج حول اللاعب يرفع التباين مع الظل */
  if (player && phase !== 'dying') {
    ctx.globalCompositeOperation = 'lighter';
    const gx = player.x + PW / 2 - camX, gy = player.y + PH / 2 - camY;
    const pg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 280);
    pg.addColorStop(0, 'rgba(' + th.light + ',0.13)'); pg.addColorStop(1, 'rgba(' + th.light + ',0)');
    ctx.fillStyle = pg; ctx.fillRect(gx - 280, gy - 280, 560, 560);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.save(); ctx.translate(-camX, -camY);
  drawWorld(th, camX, camY, glows);
  ctx.restore();
  drawOverlay(th, camX, camY, glows);
}

/* =====================================================================
   الواجهة والقوائم
   ===================================================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id));
}
function hideScreens() { document.querySelectorAll('.screen').forEach(s => s.classList.remove('show')); }
function updateHud() {
  $('hudLevel').textContent = 'المرحلة ' + (levelIdx + 1) + ' / ' + LEVELS.length;
  $('hudDeaths').textContent = 'المحاولات الفاشلة: ' + save.deaths;
}
function startLevel(idx) {
  Sound.unlock();
  hideScreens(); mode = 'play'; document.body.classList.add('playing');
  for (const k in keys) keys[k] = false;
  loadLevel(idx);
}
function pauseGame() { if (mode !== 'play') return; mode = 'pause'; showScreen('sPause'); for (const k in keys) keys[k] = false; for (const k in tch) tch[k] = false; }
function resumeGame() { if (mode !== 'pause') return; mode = 'play'; hideScreens(); }
function toMenu() {
  mode = 'menu'; document.body.classList.remove('playing');
  loadLevel(0); card = null; fade = 0.6; fadeTarget = 0;
  refreshMenu(); showScreen('sMenu');
}
function refreshMenu() {
  const has = save.unlocked > 0 || save.deaths > 0;
  $('mContinue').textContent = has ? 'متابعة (المرحلة ' + (save.unlocked + 1) + ')' : 'ابدأ اللعب';
}
function buildLevelGrid() {
  const grid = $('levelGrid'); grid.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button'); b.className = 'btn';
    b.innerHTML = '<b>' + (i + 1) + '</b><span>' + L.name + '</span>';
    if (i > save.unlocked) { b.disabled = true; b.title = 'مقفلة'; }
    b.addEventListener('click', () => startLevel(i));
    grid.appendChild(b);
  });
}
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  $('sndWave').style.display = Sound.muted ? 'none' : '';
}

$('mContinue').addEventListener('click', () => startLevel(save.unlocked));
$('mNew').addEventListener('click', () => { save = { unlocked: 0, deaths: 0, done: false }; writeSave(); refreshMenu(); startLevel(0); });
$('mLevels').addEventListener('click', () => { buildLevelGrid(); showScreen('sLevels'); });
$('lBack').addEventListener('click', () => showScreen('sMenu'));
$('pResume').addEventListener('click', resumeGame);
$('pRestart').addEventListener('click', () => { mode = 'play'; hideScreens(); restartLevel(); });
$('pMenu').addEventListener('click', toMenu);
$('eMenu').addEventListener('click', toMenu);
$('bPause').addEventListener('click', pauseGame);
$('bRestart').addEventListener('click', restartLevel);
$('bSound').addEventListener('click', toggleMute);

/* =====================================================================
   الحلقة الرئيسية
   ===================================================================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) return;
  dt = Math.min(dt, 0.05);
  if (mode === 'play') update(dt);
  else if (mode === 'menu' || mode === 'end') ambient(dt);
  else fade = approach(fade, fadeTarget, dt * 1.8);
  render();
}

readSave();
resize();
makeNoise();
loadLevel(0);
card = null; fade = 0.7;
refreshMenu();
requestAnimationFrame(frame);

/* واجهة اختبار (للتصحيح فقط) */
window.__ss = {
  start: startLevel,
  sim(frames, inputs, fn) {                           // تشغيل المحاكاة يدوياً بدون رسم
    for (const k in inputs || {}) keys[k] = !!inputs[k];
    for (let i = 0; i < frames; i++) { if (inputs && inputs.jump && i === 0) jumpLatch = true; update(1 / 60); if (fn && fn(i)) break; }
  },
  setKeys(o) { for (const k in o) keys[k] = !!o[k]; if (o.jump) jumpLatch = true; },
  get player() { return player; }, get boxes() { return boxes; }, get doors() { return doors; },
  get phase() { return phase; }, get mode() { return mode; }, get level() { return levelIdx; }, get save() { return save; },
  get cp() { return checkpoint; }, T
};
})();
</script>
